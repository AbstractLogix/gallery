<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice OCR Extractor</title>
  </head>
  <body>
    <script>
      function safeJsonParse(value) {
        if (typeof value === "object" && value !== null) return value;
        if (typeof value !== "string") return {};
        try {
          return JSON.parse(value);
        } catch {
          return {};
        }
      }

      // OCR word confidence scores below this level are frequently noisy for invoice row extraction.
      const LOW_CONFIDENCE_THRESHOLD = 60;

      function cleanTextLine(line) {
        return (line || "")
          .replace(/\t/g, " ")
          .replace(/\s+/g, " ")
          .replace(/[|]+/g, " ")
          .trim();
      }

      function detectMaterial(text) {
        const lower = (text || "").toLowerCase();
        const materials = [
          "cotton",
          "polyester",
          "wool",
          "silk",
          "nylon",
          "plastic",
          "rubber",
          "stainless steel",
          "steel",
          "aluminum",
          "aluminium",
          "copper",
          "wood",
          "leather",
          "ceramic",
          "glass",
        ];
        return materials.find((m) => lower.includes(m)) || "";
      }

      function detectOrigin(text) {
        function normalizeCountryCandidate(rawValue) {
          const stopWords = new Set([
            "fob",
            "cif",
            "exw",
            "ddp",
            "ddu",
            "incoterms",
            "invoice",
            "ref",
            "reference",
            "po",
          ]);
          const tokens = String(rawValue || "")
            .split(/\s+/)
            .map((token) => token.replace(/[^A-Za-z]/g, ""))
            .filter(Boolean);
          const out = [];
          for (const token of tokens) {
            if (stopWords.has(token.toLowerCase())) break;
            out.push(token);
            if (out.length >= 3) break;
          }
          return out.join(" ").trim();
        }

        const match = (text || "").match(
          /(?:country of origin|made in)\s*[-:]?\s*([A-Za-z][A-Za-z .-]{1,60})|\borigin\b\s*[-:]\s*([A-Za-z][A-Za-z .-]{1,60})/i,
        );
        return normalizeCountryCandidate(match?.[1] || match?.[2] || "");
      }

      function isVagueDescription(text) {
        const lower = (text || "").toLowerCase();
        const patterns = [
          /\bparts\b/,
          /\bmisc\b/,
          /\bmisc goods\b/,
          /\baccessories\b/,
          /\bassorted\b/,
        ];
        return patterns.some((pattern) => pattern.test(lower));
      }

      function parseMoney(value) {
        if (!value) return "";
        const raw = String(value);
        const parentheticalNegative = /^\s*\(.*\)\s*$/.test(raw);
        const cleaned = raw.replace(/[^0-9.,-]/g, "");
        if (!cleaned) return "";
        const sign = cleaned.startsWith("-") || parentheticalNegative ? "-" : "";
        const unsigned = cleaned.startsWith("-") ? cleaned.slice(1) : cleaned;
        if (unsigned.includes("-")) return "";
        if (!unsigned) return "";

        let normalized = unsigned;
        const hasDot = unsigned.includes(".");
        const hasComma = unsigned.includes(",");

        if (hasDot && hasComma) {
          if (unsigned.lastIndexOf(",") > unsigned.lastIndexOf(".")) {
            normalized = unsigned.replace(/\./g, "").replace(/,/g, ".");
          } else {
            normalized = unsigned.replace(/,/g, "");
          }
        } else if (hasComma && !hasDot) {
          if (/^\d{1,3}(,\d{3})+$/.test(unsigned)) {
            normalized = unsigned.replace(/,/g, "");
          } else if (/^\d+,\d{1,2}$/.test(unsigned)) {
            normalized = unsigned.replace(/,/g, ".");
          } else {
            return `${sign}${unsigned}`;
          }
        } else if (hasDot) {
          if (/^\d{1,3}(\.\d{3})+$/.test(unsigned)) {
            normalized = unsigned.replace(/\./g, "");
          }
        }

        if (!/^\d+(?:\.\d+)?$/.test(normalized)) return "";
        return `${sign}${normalized}`;
      }

      function parseQuantity(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        const parsed = parseMoney(raw);
        if (!parsed) return raw;
        return parsed.startsWith("-") ? parsed.slice(1) : parsed;
      }

      function normalizeHarmonizedNumber(value) {
        const cleaned = String(value || "").replace(/[^0-9.]/g, "");
        const collapsed = cleaned.replace(/\.{2,}/g, ".").replace(/^\.+|\.+$/g, "");
        if (!collapsed) return "";
        return /^\d{4,10}(?:\.\d{1,4}){0,2}$/.test(collapsed) ? collapsed : "";
      }

      function isLikelyUnstructuredItemLine(line) {
        const numberTokens = (line.match(/\b\d+(?:[.,]\d+)?\b/g) || []).length;
        const hasCurrency = /[$€£]/.test(line);
        const hasQtyUnit =
          /\b\d+(?:[.,]\d+)?\s*(pc|pcs|kg|g|lb|m|cm|mm|set|sets|box|boxes|pair|pairs)\b/i.test(
            line,
          );
        return (hasCurrency && numberTokens >= 2) || (hasQtyUnit && numberTokens >= 2);
      }

      function detectMimeTypeFromBase64(base64, mimeHint) {
        if ((mimeHint || "").trim()) return mimeHint.trim();
        const normalized = (base64 || "").replace(/\s/g, "");
        if (normalized.startsWith("JVBERi0")) return "application/pdf";
        if (normalized.startsWith("iVBORw0KGgo")) return "image/png";
        if (normalized.startsWith("/9j/")) return "image/jpeg";
        if (normalized.startsWith("R0lGOD")) return "image/gif";
        if (normalized.startsWith("Qk0")) return "image/bmp";
        return "";
      }

      function toDataUri(base64, mimeHint) {
        if (!base64) return { dataUri: "", warning: "" };
        if (base64.startsWith("data:")) return { dataUri: base64, warning: "" };
        const mimeType = detectMimeTypeFromBase64(base64, mimeHint);
        if (!mimeType) {
          return {
            dataUri: "",
            warning:
              "Unable to infer MIME type from base64 payload. Provide invoice_image_mime_type explicitly.",
          };
        }
        const normalized = base64.replace(/\s/g, "");
        return { dataUri: `data:${mimeType};base64,${normalized}`, warning: "" };
      }

      function extractLineItemsFromText(rawText) {
        const lines = String(rawText || "")
          .split(/\r?\n/)
          .map(cleanTextLine)
          .filter(Boolean);

        const itemRows = [];
        const warnings = [];

        const rowRegex =
          /^(?<description>.+?)\s+(?<quantity>\d+(?:[.,]\d+)?)(?:\s+(?<unit>[A-Za-z]{1,6}))?\s+(?<unitPrice>[\$€£]?(?:\d{1,3}(?:[.,]\d{3})+|\d+)(?:[.,]\d{1,2})?)\s+(?<lineTotal>[\$€£]?(?:\d{1,3}(?:[.,]\d{3})+|\d+)(?:[.,]\d{1,2})?)$/;

        lines.forEach((line, idx) => {
          if (/^\s*(subtotal|total|tax|amount due)\b/i.test(line)) {
            return;
          }

          const rowMatch = line.match(rowRegex);
          if (rowMatch?.groups) {
            const description = rowMatch.groups.description.trim();
            const item = {
              index: itemRows.length + 1,
              source_line: idx + 1,
              raw_line: line,
              description,
              quantity: parseQuantity(rowMatch.groups.quantity || ""),
              unit: rowMatch.groups.unit || "",
              unit_price: parseMoney(rowMatch.groups.unitPrice) || "",
              line_total: parseMoney(rowMatch.groups.lineTotal) || "",
              unit_price_raw: rowMatch.groups.unitPrice || "",
              line_total_raw: rowMatch.groups.lineTotal || "",
              declared_value_raw: "",
              material: detectMaterial(description),
              country_of_origin: detectOrigin(line),
              extraction_flags: [],
            };
            if (isVagueDescription(description)) {
              item.extraction_flags.push("vague_description");
            }
            itemRows.push(item);
            return;
          }

          if (line.length > 6 && isLikelyUnstructuredItemLine(line)) {
            const item = {
              index: itemRows.length + 1,
              source_line: idx + 1,
              raw_line: line,
              description: line,
              quantity: "",
              unit: "",
              unit_price: "",
              line_total: "",
              unit_price_raw: "",
              line_total_raw: "",
              declared_value_raw: "",
              material: detectMaterial(line),
              country_of_origin: detectOrigin(line),
              extraction_flags: ["unstructured_row"],
            };
            if (isVagueDescription(line)) {
              item.extraction_flags.push("vague_description");
            }
            itemRows.push(item);
          }
        });

        if (!itemRows.length) {
          const findFieldValue = (fieldNames) => {
            for (const fieldName of fieldNames) {
              const pattern = new RegExp(`^${fieldName}\\s*:\\s*(.+)$`, "i");
              for (const line of lines) {
                const match = line.match(pattern);
                if (match?.[1]?.trim()) return match[1].trim();
              }
            }
            return "";
          };

          const description = findFieldValue([
            "description of goods",
            "goods description",
            "item description",
            "description",
          ]);
          const quantityRaw = findFieldValue(["units", "quantity", "qty"]);
          const unitRaw = findFieldValue(["measure", "unit of measure", "uom"]);
          const valueRaw = findFieldValue(["value", "line total", "total value", "amount"]);
          const harmonizedRaw = findFieldValue([
            "harmonized tariff number",
            "harmonized number",
            "harmonized code",
            "hs code",
            "htsus",
            "tariff number",
          ]);
          const countryRaw = findFieldValue(["country of origin", "origin country", "country"]);

          if (description) {
            const normalizedHarmonized = normalizeHarmonizedNumber(harmonizedRaw);
            const item = {
              index: itemRows.length + 1,
              source_line: 0,
              raw_line: "",
              description,
              quantity: parseQuantity(quantityRaw),
              unit: unitRaw || "",
              unit_price: "",
              line_total: parseMoney(valueRaw) || "",
              unit_price_raw: "",
              line_total_raw: valueRaw,
              declared_value_raw: valueRaw,
              material: detectMaterial(description),
              country_of_origin: countryRaw || "",
              extraction_flags: ["from_key_value_fields"],
            };

            if (normalizedHarmonized) {
              item.invoice_harmonized_number = normalizedHarmonized;
              item.extraction_flags.push("invoice_provided_harmonized_number");
            }
            if (isVagueDescription(description)) {
              item.extraction_flags.push("vague_description");
            }
            itemRows.push(item);
            warnings.push("Recovered line item using key-value invoice fields.");
          }
        }

        if (!itemRows.length) {
          warnings.push("No clear line item rows detected from OCR text.");
        }

        return { itemRows, warnings };
      }

      async function runOcrSpace(payload, secret) {
        const apiKey = (secret || "").trim();
        if (!apiKey) {
          return {
            text: payload.ocr_text || "",
            pages: 0,
            confidence: null,
            warnings: ["No OCR API key provided; used supplied ocr_text only."],
          };
        }

        const sourceUrl = payload.invoice_image_url || payload.invoice_pdf_url || payload.file_url || "";
        const sourceBase64 = payload.invoice_image_base64 || payload.image_base64 || "";
        const sourceMimeType = payload.invoice_image_mime_type || payload.mime_type || "";

        if (!sourceUrl && !sourceBase64 && !payload.ocr_text) {
          return {
            text: "",
            pages: 0,
            confidence: null,
            warnings: [
              "No OCR source found. Provide invoice_image_base64, invoice_image_url, invoice_pdf_url, or ocr_text.",
            ],
          };
        }

        if (!sourceUrl && !sourceBase64) {
          return {
            text: payload.ocr_text || "",
            pages: 0,
            confidence: null,
            warnings: ["Used supplied ocr_text because no file source was provided."],
          };
        }

        try {
          const body = new URLSearchParams();
          body.set("apikey", apiKey);
          body.set("language", "eng");
          body.set("isTable", "true");
          body.set("scale", "true");
          body.set("OCREngine", "2");

          if (sourceBase64) {
            const { dataUri, warning } = toDataUri(sourceBase64, sourceMimeType);
            if (!dataUri) {
              return {
                text: payload.ocr_text || "",
                pages: 0,
                confidence: null,
                warnings: [warning || "Unable to parse base64 payload for OCR request."],
              };
            }
            body.set("base64Image", dataUri);
          } else {
            body.set("url", sourceUrl);
          }

          const response = await fetch("https://api.ocr.space/parse/image", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
            },
            body,
          });

          if (!response.ok) {
            throw new Error(`OCR request failed with HTTP ${response.status}`);
          }

          const json = await response.json();
          const results = Array.isArray(json?.ParsedResults) ? json.ParsedResults : [];
          const textParts = results
            .map((r) => r?.ParsedText || "")
            .filter(Boolean)
            .join("\n");

          const confidenceSamples = [];
          results.forEach((r) => {
            const lines = r?.TextOverlay?.Lines || [];
            lines.forEach((line) => {
              const words = line?.Words || [];
              words.forEach((w) => {
                if (typeof w?.Confidence === "number") confidenceSamples.push(w.Confidence);
              });
            });
          });

          const avgConfidence = confidenceSamples.length
            ? Number(
                (
                  confidenceSamples.reduce((sum, c) => sum + c, 0) / confidenceSamples.length
                ).toFixed(2),
              )
            : null;

          const warnings = [];
          if (!textParts.trim()) {
            warnings.push("OCR completed but returned empty text.");
          }
          if (
            /(?:page|sheet)\s*\d+\s*(?:of|\/)\s*(?:[2-9]\d*|\d{2,})|(?:^|\n)\s*[1-9]\d?\s*\/\s*(?:[2-9]\d*|\d{2,})\s*(?:$|\n)/i.test(
              textParts,
            )
          ) {
            warnings.push("possible_multi_page_invoice");
          }
          if (avgConfidence !== null && avgConfidence < LOW_CONFIDENCE_THRESHOLD) {
            warnings.push("OCR confidence is low; extracted rows may be incomplete.");
          }

          const mergedText = textParts.trim() ? textParts : payload.ocr_text || "";

          return {
            text: mergedText,
            pages: results.length,
            confidence: avgConfidence,
            warnings,
          };
        } catch (err) {
          return {
            text: payload.ocr_text || "",
            pages: 0,
            confidence: null,
            warnings: [
              `OCR API call failed: ${err?.message || "unknown error"}. Falling back to supplied ocr_text if present.`,
            ],
          };
        }
      }

      function buildFollowUpQuestions(
        items,
        extractionWarnings,
        destinationExplicitlyProvided,
      ) {
        const questions = [];

        if (!destinationExplicitlyProvided) {
          questions.push("Are the goods definitely being imported into the United States?");
        }

        if (items.some((it) => it.extraction_flags.includes("vague_description"))) {
          questions.push("Can you provide a more specific product description for rows marked vague?");
        }

        if (items.some((it) => !it.material)) {
          questions.push("What is the material or composition for items missing material detail?");
        }

        if (items.some((it) => !it.country_of_origin)) {
          questions.push("What is the country of origin for each item?");
        }

        if (items.some((it) => !it.quantity || !it.unit_price || !it.line_total)) {
          questions.push("Can you confirm quantity, unit price, and line total for incomplete rows?");
        }

        if (
          (extractionWarnings || []).some((w) =>
            /possible_multi_page_invoice|multi.?page|empty text|no clear line item/i.test(w),
          )
        ) {
          questions.push("Are these all the invoice pages, or are additional pages coming?");
        }

        return [...new Set(questions)];
      }

      /**
       * Skill entry point.
       * @param {string} data JSON string containing extraction input fields.
       * @param {string} secret Optional OCR API key passed by secure secret input.
       * @returns {Promise<string>} JSON string with either { result: object } or { error: string }.
       */
      window["ai_edge_gallery_get_result"] = async (data, secret) => {
        try {
          const payload = safeJsonParse(data);
          const destinationExplicitlyProvided = Boolean(
            String(payload.destination_country || "").trim(),
          );
          const destinationCountry = String(payload.destination_country || "US").trim();

          const ocr = await runOcrSpace(payload, secret);
          const extraction = extractLineItemsFromText(ocr.text);

          const warnings = [...(ocr.warnings || []), ...(extraction.warnings || [])];

          const followUpQuestions = buildFollowUpQuestions(
            extraction.itemRows,
            warnings,
            destinationExplicitlyProvided,
          );

          const resultPayload = {
            source: {
              destination_country: destinationCountry,
              pages_detected: ocr.pages,
              ocr_confidence: ocr.confidence,
            },
            extraction_warnings: warnings,
            line_items: extraction.itemRows,
            follow_up_questions: followUpQuestions,
            notes: [
              "Rows with extraction_flags need lower classification confidence until clarified.",
              "If only one page was provided but invoice appears multi-page, request remaining pages.",
            ],
          };

          return JSON.stringify({ result: resultPayload });
        } catch (e) {
          return JSON.stringify({
            error: `Invoice extraction failed: ${e?.message || "unknown error"}`,
          });
        }
      };
    </script>
  </body>
</html>
